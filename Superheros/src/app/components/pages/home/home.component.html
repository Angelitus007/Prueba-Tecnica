<div class="p-home">
  <alert [alertState]="alertState()" />

  <section-search-creation
    class="p-home__search-creation"
    [filter]="filter"
    (filterChange)="onFilterChanged($event)"
    (createHeroClicked)="openCreateDialog()"
  />
  <section-list-heroes
    class="p-home__list-heros"
    [heroes]="heroes()"
    [isLoading]="isLoading()"
    [paginationConfig]="paginationConfigGetter"
    (pageChange)="onPageChange($event)"
    (deleteHero)="openDeleteDialog($event)"
    (updateHero)="openUpdateDialog($event)"
  />
</div>
