@if (alertState()?.isDisplayed) {
<div class="c-alert" [class]="alertState()?.alert?.type">
  <span class="c-alert__message">
    <img
      class="c-alert__img"
      [src]="
        alertState()?.alert?.type === 'success'
          ? 'assets/success.svg'
          : 'assets/error.svg'
      "
      [alt]="
        alertState()?.alert?.type === 'success' ? 'Success Icon' : 'Error Icon'
      "
    />
    {{ alertState()?.alert?.message }}
  </span>
</div>
}
