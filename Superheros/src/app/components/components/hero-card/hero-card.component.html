<div class="c-hero-card">

  <img class="c-hero-card__photo" [src]="hero()?.photo" alt="Photo of {{ hero()?.name }}" />

  <div class="c-hero-card__content">
    <h3 class="c-hero-card__name"> {{hero()?.name}} </h3>
    <p class="c-hero-card__superpower"> {{hero()?.superpower}} </p>
    <p class="c-hero-card__description"> {{hero()?.description}} </p>
    <p class="c-hero-card__city"> {{hero()?.city}} </p>

    <div class="c-hero-card__buttons">
      <button class="c-hero-card__b-editar" (click)="onUpdateClick()">
        <img src="assets/pencil.svg" alt="Editar"/>
        Editar
      </button>
      <button class="c-hero-card__b-eliminar" (click)="onDeleteClick()">Eliminar</button>
    </div>
  </div>

</div>
